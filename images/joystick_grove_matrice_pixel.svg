<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <radialGradient id="thumb-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="led-pix-on" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="920" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Titre -->
  <text x="460" y="32" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">
    Contrôle de Position d'un Pixel sur Matrice 8×8 par Joystick Grove
  </text>
  <text x="460" y="52" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">
    Acquisition de deux grandeurs analogiques UX et UY (CAN RP2040) et discrétisation spatiale
  </text>

  <!-- ================= 1. BLOC GAUCHE : JOYSTICK GROVE ================= -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <!-- PCB Joystick -->
    <rect x="0" y="0" width="230" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="38" rx="8" fill="#0d9488"/>
    <rect x="0" y="28" width="230" height="10" fill="#0d9488"/>
    <text x="115" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">
      1. GROVE THUMB JOYSTICK
    </text>

    <!-- Dessin du stick analogique vu de dessus -->
    <circle cx="115" cy="120" r="62" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Axes X et Y dessinés sur le socle -->
    <line x1="45" y1="120" x2="185" y2="120" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="115" y1="50" x2="115" y2="190" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="180" y="114" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0d9488">+X</text>
    <text x="122" y="62" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0d9488">+Y</text>

    <!-- Pommeau du stick déplacé vers le haut-droite (exemple de position) -->
    <circle cx="132" cy="103" r="38" fill="url(#thumb-grad)" stroke="#334155" stroke-width="3"/>
    <circle cx="132" cy="103" r="22" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <circle cx="132" cy="103" r="8" fill="#1e293b"/>

    <!-- Tensions délivrées -->
    <rect x="15" y="200" width="200" height="60" rx="5" fill="#f0fdf4" stroke="#86efac"/>
    <text x="115" y="222" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#166534">
      2 Potentiomètres 10 kΩ
    </text>
    <text x="115" y="242" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" fill="#15803d">
      UX, UY ∈ [0,0 V ; 3,3 V]
    </text>

    <!-- Broches de sortie -->
    <text x="20" y="282" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">• Repos : UX ≈ 1,65 V | UY ≈ 1,65 V</text>
    <text x="20" y="302" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">• Fil Jaune (X) &rarr; CAN0 (GP26)</text>
    <text x="20" y="322" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">• Fil Blanc (Y) &rarr; CAN1 (GP27)</text>
  </g>

  <!-- ================= 2. BLOC CENTRAL : PICO TRAITEMENT ================= -->
  <!-- Flèche 1 vers Pico -->
  <line x1="270" y1="230" x2="330" y2="230" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="218" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#2563eb">UX, UY</text>

  <g transform="translate(340, 95)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="300" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="38" rx="8" fill="#2563eb"/>
    <rect x="0" y="28" width="230" height="10" fill="#2563eb"/>
    <text x="115" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">
      2. RASPBERRY PI PICO
    </text>

    <text x="115" y="65" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">
      Numérisation &amp; Mapping
    </text>

    <!-- Étape 1 : Lecture ADC -->
    <rect x="15" y="80" width="200" height="52" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="100" font-family="'Consolas', monospace" font-size="11" fill="#93c5fd">Nx = adc_x.read_u16()</text>
    <text x="25" y="120" font-family="'Consolas', monospace" font-size="11" fill="#93c5fd">Ny = adc_y.read_u16()</text>

    <!-- Étape 2 : Discrétisation spatiale -->
    <text x="115" y="152" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fde047">
      Discrétisation sur [0 .. 7] :
    </text>

    <rect x="15" y="162" width="200" height="64" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="185" font-family="'Consolas', monospace" font-size="11" fill="#4ade80">col = int(Nx * 8 / 65536)</text>
    <text x="25" y="208" font-family="'Consolas', monospace" font-size="11" fill="#4ade80">lig = int(Ny * 8 / 65536)</text>

    <!-- Étape 3 : Génération motif matrice -->
    <rect x="15" y="236" width="200" height="48" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="255" font-family="'Consolas', monospace" font-size="10.5" fill="#fca5a5">motif = [0] * 8</text>
    <text x="25" y="272" font-family="'Consolas', monospace" font-size="10.5" fill="#fca5a5">motif[lig] = 1 &lt;&lt; (7 - col)</text>
  </g>

  <!-- ================= 3. BLOC DROITE : MATRICE DEL 8X8 ================= -->
  <!-- Flèche 2 vers Matrice -->
  <line x1="570" y1="230" x2="630" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="600" y="218" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#dc2626">I²C Bus</text>

  <g transform="translate(640, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="38" rx="8" fill="#dc2626"/>
    <rect x="0" y="28" width="240" height="10" fill="#dc2626"/>
    <text x="120" y="25" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">
      3. MATRICE DEL 8×8 (HT16K33)
    </text>

    <!-- Boîtier Matrice miniature 8x8 -->
    <rect x="35" y="55" width="170" height="170" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Grille de 8x8 DELs -->
    <!-- Le pixel illuminé est en col=5, lig=2 par exemple -->
    <g transform="translate(50, 70)">
      <!-- 8 rangées de DELs espacées de 18px -->
      <!-- Rangées 0, 1 -->
      <circle cx="0" cy="0" r="4" fill="#334155"/><circle cx="18" cy="0" r="4" fill="#334155"/><circle cx="36" cy="0" r="4" fill="#334155"/><circle cx="54" cy="0" r="4" fill="#334155"/><circle cx="72" cy="0" r="4" fill="#334155"/><circle cx="90" cy="0" r="4" fill="#334155"/><circle cx="108" cy="0" r="4" fill="#334155"/><circle cx="126" cy="0" r="4" fill="#334155"/>
      <circle cx="0" cy="18" r="4" fill="#334155"/><circle cx="18" cy="18" r="4" fill="#334155"/><circle cx="36" cy="18" r="4" fill="#334155"/><circle cx="54" cy="18" r="4" fill="#334155"/><circle cx="72" cy="18" r="4" fill="#334155"/><circle cx="90" cy="18" r="4" fill="#334155"/><circle cx="108" cy="18" r="4" fill="#334155"/><circle cx="126" cy="18" r="4" fill="#334155"/>

      <!-- Rangée 2 : PIXEL ACTIF EN col=5 (x=90) -->
      <circle cx="0" cy="36" r="4" fill="#334155"/><circle cx="18" cy="36" r="4" fill="#334155"/><circle cx="36" cy="36" r="4" fill="#334155"/><circle cx="54" cy="36" r="4" fill="#334155"/><circle cx="72" cy="36" r="4" fill="#334155"/>
      <!-- LED ALLUMÉE -->
      <circle cx="90" cy="36" r="6.5" fill="url(#led-pix-on)" filter="url(#glow)"/>
      <circle cx="108" cy="36" r="4" fill="#334155"/><circle cx="126" cy="36" r="4" fill="#334155"/>

      <!-- Rangées 3 à 7 -->
      <circle cx="0" cy="54" r="4" fill="#334155"/><circle cx="18" cy="54" r="4" fill="#334155"/><circle cx="36" cy="54" r="4" fill="#334155"/><circle cx="54" cy="54" r="4" fill="#334155"/><circle cx="72" cy="54" r="4" fill="#334155"/><circle cx="90" cy="54" r="4" fill="#334155"/><circle cx="108" cy="54" r="4" fill="#334155"/><circle cx="126" cy="54" r="4" fill="#334155"/>
      <circle cx="0" cy="72" r="4" fill="#334155"/><circle cx="18" cy="72" r="4" fill="#334155"/><circle cx="36" cy="72" r="4" fill="#334155"/><circle cx="54" cy="72" r="4" fill="#334155"/><circle cx="72" cy="72" r="4" fill="#334155"/><circle cx="90" cy="72" r="4" fill="#334155"/><circle cx="108" cy="72" r="4" fill="#334155"/><circle cx="126" cy="72" r="4" fill="#334155"/>
      <circle cx="0" cy="90" r="4" fill="#334155"/><circle cx="18" cy="90" r="4" fill="#334155"/><circle cx="36" cy="90" r="4" fill="#334155"/><circle cx="54" cy="90" r="4" fill="#334155"/><circle cx="72" cy="90" r="4" fill="#334155"/><circle cx="90" cy="90" r="4" fill="#334155"/><circle cx="108" cy="90" r="4" fill="#334155"/><circle cx="126" cy="90" r="4" fill="#334155"/>
      <circle cx="0" cy="108" r="4" fill="#334155"/><circle cx="18" cy="108" r="4" fill="#334155"/><circle cx="36" cy="108" r="4" fill="#334155"/><circle cx="54" cy="108" r="4" fill="#334155"/><circle cx="72" cy="108" r="4" fill="#334155"/><circle cx="90" cy="108" r="4" fill="#334155"/><circle cx="108" cy="108" r="4" fill="#334155"/><circle cx="126" cy="108" r="4" fill="#334155"/>
      <circle cx="0" cy="126" r="4" fill="#334155"/><circle cx="18" cy="126" r="4" fill="#334155"/><circle cx="36" cy="126" r="4" fill="#334155"/><circle cx="54" cy="126" r="4" fill="#334155"/><circle cx="72" cy="126" r="4" fill="#334155"/><circle cx="90" cy="126" r="4" fill="#334155"/><circle cx="108" cy="126" r="4" fill="#334155"/><circle cx="126" cy="126" r="4" fill="#334155"/>
    </g>

    <!-- Légende sous la matrice -->
    <rect x="20" y="240" width="200" height="85" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="120" y="260" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991b1b">
      Pixel Actif : (col = 5, lig = 2)
    </text>
    <text x="120" y="280" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">
      Suit en temps réel la position
    </text>
    <text x="120" y="296" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">
      du manche du Joystick !
    </text>
  </g>

  <!-- Note en bas -->
  <rect x="40" y="425" width="840" height="26" rx="4" fill="#f1f5f9"/>
  <text x="460" y="442" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">
    💡 Les images du dossier <tspan font-family="monospace" font-weight="bold">images/</tspan> sont mutualisées et directement exploitables dans les différents TPs de Sciences de l'Ingénieur.
  </text>
</svg>
