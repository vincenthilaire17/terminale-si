<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .signal-uart { stroke: #38bdf8; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .signal-sample { stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .sample-arrow { fill: #f59e0b; }
      .txt-title { fill: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: bold; }
      .txt-bit { fill: #e2e8f0; font-family: 'Consolas', monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .txt-val { fill: #38bdf8; font-family: 'Consolas', monospace; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .txt-time { fill: #94a3b8; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
      .txt-note { fill: #cbd5e1; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; }
      .box-highlight { fill: rgba(56, 189, 248, 0.08); stroke: #0284c7; stroke-width: 1; rx: 6px; }
      .badge-start { fill: #ef4444; }
      .badge-stop { fill: #10b981; }
      .badge-data { fill: #3b82f6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="time-arrow-l" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#94a3b8" />
    </marker>
    <marker id="time-arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="360" class="bg"/>

  <!-- Header -->
  <text x="30" y="38" class="txt-title">Structure d'une Trame UART 8N1 — Exemple Touche '1' (ASCII 0x31 = 0b00110001)</text>
  <text x="30" y="60" class="txt-note">Signal TTL 3.3V au repos à l'état HAUT (Marque). Transmission LSB en premier (Least Significant Bit).</text>

  <!-- Voltage reference lines -->
  <line x1="80" y1="120" x2="890" y2="120" class="grid-line"/>
  <text x="35" y="124" fill="#94a3b8" font-size="12px" font-family="Consolas">3.3V (1)</text>
  
  <line x1="80" y1="200" x2="890" y2="200" class="grid-line"/>
  <text x="40" y="204" fill="#94a3b8" font-size="12px" font-family="Consolas">0V (0)</text>

  <!-- Bit Zones: 
       Start: x=130 to 200
       D0 (1): 200 to 270 (LSB)
       D1 (0): 270 to 340
       D2 (0): 340 to 410
       D3 (0): 410 to 480
       D4 (1): 480 to 550
       D5 (1): 550 to 620
       D6 (0): 620 to 690
       D7 (0): 690 to 760 (MSB)
       Stop:   760 to 830
       Idle:   830 to 890
  -->
  
  <!-- Highlight data container -->
  <rect x="200" y="90" width="560" height="150" class="box-highlight"/>

  <!-- Vertical grid separators between bits -->
  <line x1="130" y1="90" x2="130" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="200" y1="90" x2="200" y2="240" stroke="#475569" stroke-width="1"/>
  <line x1="270" y1="90" x2="270" y2="240" stroke="#334155" stroke-dasharray="2 2"/>
  <line x1="340" y1="90" x2="340" y2="240" stroke="#334155" stroke-dasharray="2 2"/>
  <line x1="410" y1="90" x2="410" y2="240" stroke="#334155" stroke-dasharray="2 2"/>
  <line x1="480" y1="90" x2="480" y2="240" stroke="#334155" stroke-dasharray="2 2"/>
  <line x1="550" y1="90" x2="550" y2="240" stroke="#334155" stroke-dasharray="2 2"/>
  <line x1="620" y1="90" x2="620" y2="240" stroke="#334155" stroke-dasharray="2 2"/>
  <line x1="690" y1="90" x2="690" y2="240" stroke="#334155" stroke-dasharray="2 2"/>
  <line x1="760" y1="90" x2="760" y2="240" stroke="#475569" stroke-width="1"/>
  <line x1="830" y1="90" x2="830" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Waveform: Touche '1' = ASCII 0x31 = 0011 0001 bin -> LSB first: 1, 0, 0, 0, 1, 1, 0, 0 -->
  <!-- Idle (80->130, H), Start (130->200, L), D0=1 (200->270, H), D1=0 (270->340, L), D2=0 (340->410, L), D3=0 (410->480, L), D4=1 (480->550, H), D5=1 (550->620, H), D6=0 (620->690, L), D7=0 (690->760, L), Stop (760->830, H), Idle (830->890, H) -->
  <path d="M 80 120 
           L 130 120 
           L 130 200 
           L 200 200 
           L 200 120 
           L 270 120 
           L 270 200 
           L 480 200 
           L 480 120 
           L 620 120 
           L 620 200 
           L 760 200 
           L 760 120 
           L 890 120" class="signal-uart"/>

  <!-- Bit labels at top -->
  <text x="105" y="105" class="txt-bit" fill="#94a3b8">Repos</text>
  <rect x="140" y="93" width="50" height="18" rx="4" class="badge-start"/>
  <text x="165" y="106" class="txt-bit" fill="#ffffff">START</text>

  <text x="235" y="106" class="txt-bit">D0 (LSB)</text>
  <text x="305" y="106" class="txt-bit">D1</text>
  <text x="375" y="106" class="txt-bit">D2</text>
  <text x="445" y="106" class="txt-bit">D3</text>
  <text x="515" y="106" class="txt-bit">D4</text>
  <text x="585" y="106" class="txt-bit">D5</text>
  <text x="655" y="106" class="txt-bit">D6</text>
  <text x="725" y="106" class="txt-bit">D7 (MSB)</text>

  <rect x="770" y="93" width="50" height="18" rx="4" class="badge-stop"/>
  <text x="795" y="106" class="txt-bit" fill="#ffffff">STOP</text>
  <text x="860" y="105" class="txt-bit" fill="#94a3b8">Repos</text>

  <!-- Bit Logical Values -->
  <text x="165" y="222" class="txt-val" fill="#ef4444">'0'</text>
  <text x="235" y="222" class="txt-val">'1'</text>
  <text x="305" y="222" class="txt-val">'0'</text>
  <text x="375" y="222" class="txt-val">'0'</text>
  <text x="445" y="222" class="txt-val">'0'</text>
  <text x="515" y="222" class="txt-val">'1'</text>
  <text x="585" y="222" class="txt-val">'1'</text>
  <text x="655" y="222" class="txt-val">'0'</text>
  <text x="725" y="222" class="txt-val">'0'</text>
  <text x="795" y="222" class="txt-val" fill="#10b981">'1'</text>

  <!-- Sampling points (middle of bits) -->
  <line x1="165" y1="205" x2="165" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="235" y1="125" x2="235" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="305" y1="205" x2="305" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="375" y1="205" x2="375" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="445" y1="205" x2="445" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="515" y1="125" x2="515" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="585" y1="125" x2="585" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="655" y1="205" x2="655" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="725" y1="205" x2="725" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <line x1="795" y1="125" x2="795" y2="255" class="signal-sample" marker-end="url(#arrow)"/>
  <text x="480" y="275" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="12px" text-anchor="middle">▲ Points d'échantillonnage récepteur (au centre de chaque période de bit Tbit)</text>

  <!-- Time measurement arrow for Tbit -->
  <line x1="130" y1="305" x2="200" y2="305" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#time-arrow-l)" marker-end="url(#time-arrow-r)"/>
  <text x="165" y="322" class="txt-time">Tbit = 1/9600 ≈ 104 µs</text>

  <!-- Total frame duration -->
  <line x1="130" y1="335" x2="830" y2="335" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#time-arrow-l)" marker-end="url(#time-arrow-r)"/>
  <text x="480" y="352" class="txt-time" fill="#38bdf8">Durée totale trame = 10 × Tbit ≈ 1,04 ms (1 Start + 8 Données + 1 Stop)</text>
</svg>
