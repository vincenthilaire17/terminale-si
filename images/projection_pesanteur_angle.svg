<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <!-- Marqueurs de flèches -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="850" height="480" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Titre -->
  <text x="425" y="34" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">
    Projection Vectorielle de l'Accélération de la Pesanteur dans un Repère Incliné
  </text>
  <text x="425" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">
    Modélisation du calcul de l'angle d'inclinaison θ par l'accéléromètre 3 axes (Grove MMA7660FC)
  </text>

  <!-- ================= ZONE GAUCHE : DESSIN VECTORIEL ================= -->
  <g transform="translate(230, 250)">
    <!-- Sol / Horizon terrestre de référence -->
    <line x1="-190" y1="0" x2="190" y2="0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="185" y="-8" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#64748b">Horizon terrestre (Sol)</text>

    <!-- Axe vertical terrestre de référence Y0 (vers le bas) -->
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="8" y="165" font-family="'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#64748b">Verticale terrestre</text>

    <!-- Arc d'angle d'inclinaison entre l'horizon et l'axe x_c -->
    <!-- Angle theta = 26 deg : cos(26)=0.898, sin(26)=0.438 -->
    <!-- Arc horizon -> xc (r = 110) -->
    <path d="M 110 0 A 110 110 0 0 0 98.8 -48.2" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <text x="115" y="-22" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#d97706">θ</text>

    <!-- Arc verticale -> yc (r = 90) -->
    <path d="M 0 90 A 90 90 0 0 0 -39.4 80.8" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <text x="-18" y="115" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#d97706">θ</text>

    <!-- Repère capteur incliné (tourné de theta = -26° par rapport à l'horizon, soit vers le haut-droit) -->
    <!-- Axe X_capteur : longueur 180 (angle -26 deg : dx = 180*0.898 = 161.6, dy = -180*0.438 = -78.8) -->
    <line x1="-161.6" y1="78.8" x2="161.6" y2="-78.8" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="175" y="-82" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#0d9488">x_c</text>

    <!-- Axe Y_capteur (perpendiculaire à x_c, angle 64 deg : dx = 160*0.438 = 70.1, dy = 160*0.898 = 143.7) -->
    <line x1="-70.1" y1="-143.7" x2="70.1" y2="143.7" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="80" y="152" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#0d9488">y_c</text>

    <!-- Origine O -->
    <circle cx="0" cy="0" r="4.5" fill="#1e293b"/>
    <text x="-16" y="-8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1e293b">O</text>

    <!-- VECTEUR PESANTEUR g (vertical vers le bas, longueur 150) -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrow-red)"/>
    <text x="14" y="80" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#dc2626">g = 1 g</text>
    <text x="14" y="98" font-family="'Segoe UI', sans-serif" font-size="11" fill="#dc2626">(Pesanteur 9,81 m/s²)</text>

    <!-- Projection orthogonale sur Y_capteur : composante a_y -->
    <!-- Proj de (0, 150) sur Y_c (direction (0.438, 0.898)) : scalaire = 150 * 0.898 = 134.7 -->
    <!-- Point proj sur Y_c : (134.7 * 0.438, 134.7 * 0.898) = (59.0, 121.0) -->
    <line x1="0" y1="150" x2="59.0" y2="121.0" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,3"/>
    <!-- Vecteur composante a_y -->
    <line x1="0" y1="0" x2="59.0" y2="121.0" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="68" y="105" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#2563eb">a_y = g · cos(θ)</text>

    <!-- Projection orthogonale sur X_capteur : composante a_x -->
    <!-- Proj de (0, 150) sur X_c (direction (0.898, -0.438)) : scalaire = 150 * (-0.438) = -65.7 -->
    <!-- Point proj sur X_c : (-65.7 * 0.898, -65.7 * -0.438) = (-59.0, 28.8) -->
    <line x1="0" y1="150" x2="-59.0" y2="28.8" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,3"/>
    <!-- Vecteur composante a_x -->
    <line x1="0" y1="0" x2="-59.0" y2="28.8" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="-165" y="42" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#2563eb">a_x = -g · sin(θ)</text>

    <!-- Rectangle d'angle droit pour proj sur Y_c -->
    <path d="M 52.8 108.3 L 41.5 113.8 L 47.7 126.5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- ================= ZONE DROITE : EXPLICATIONS MATHÉMATIQUES & FORMULES ================= -->
  <g transform="translate(490, 80)" filter="url(#shadow)">
    <!-- Carte d'explication -->
    <rect x="0" y="0" width="335" height="365" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="335" height="42" rx="8" fill="#1e3a8a"/>
    <rect x="0" y="32" width="335" height="10" fill="#1e3a8a"/>
    <text x="167" y="27" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
      📐 Analyse Trigonométrique
    </text>

    <!-- Contenu texte -->
    <text x="18" y="68" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">1. Projections de la pesanteur :</text>
    <text x="25" y="90" font-family="'Consolas', monospace" font-size="12" fill="#2563eb">• a_x = -g · sin(θ)</text>
    <text x="25" y="110" font-family="'Consolas', monospace" font-size="12" fill="#2563eb">• a_y =  g · cos(θ)</text>

    <text x="18" y="138" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">2. Rapport trigonométrique :</text>
    <rect x="18" y="148" width="298" height="44" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="167" y="175" text-anchor="middle" font-family="'Cambria Math', serif" font-size="15" font-weight="bold" fill="#1e3a8a">
      tan(θ) = -a_x / a_y
    </text>

    <text x="18" y="218" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">3. Déduction de l'angle d'inclinaison :</text>
    <rect x="18" y="228" width="298" height="52" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="167" y="252" text-anchor="middle" font-family="'Cambria Math', serif" font-size="14" font-weight="bold" fill="#166534">
      θ = arctan( -a_x / a_y )
    </text>
    <text x="167" y="271" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" fill="#15803d">
      En Python : θ = atan2(-a_x, a_y)
    </text>

    <!-- Note d'ingénierie -->
    <rect x="18" y="294" width="298" height="58" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <text x="26" y="312" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#b45309">💡 Propriété remarquable en SI :</text>
    <text x="26" y="328" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#78350f">Le calcul du quotient a_x / a_y élimine l'amplitude g :</text>
    <text x="26" y="342" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#78350f">l'angle ne dépend pas du facteur d'échelle du capteur !</text>
  </g>
</svg>
